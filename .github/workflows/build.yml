name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "SAIMS-Sales-and-Inventory-Management-System/SAIMS-Sales-and-Inventory-Management-System.vbproj"

      - name: Build
        run: dotnet build "SAIMS-Sales-and-Inventory-Management-System/SAIMS-Sales-and-Inventory-Management-System.vbproj" --no-restore --configuration Release

      - name: Build Tests
        run: dotnet build "SAIMS.Tests/SAIMS.Tests.vbproj" --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test "SAIMS.Tests/SAIMS.Tests.vbproj" --no-build --configuration Release --verbosity normal
